# chenyi 反向代理配置（HTTPS 版）
# 启用条件：deploy/certs/fullchain.pem 与 privkey.pem 存在（由 init-letsencrypt.sh 生成）。
# deploy.sh 会在证书存在时自动把本文件复制为 runtime/nginx.conf 并重建 nginx 容器。
#
# 三个 server：
#   1) 80 默认 server：保留 IP 直连（http://IP）与 certbot 校验，不跳转
#   2) 80 域名 server：acme 校验 + 全部 301 到 https
#   3) 443 域名 server：正式站点

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# ---------------------------------------------------------------------------
# 1) 80 默认 server：IP 直连兜底 + certbot 校验
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ---------------------------------------------------------------------------
# 2) 80 域名 server：HTTP 一律跳 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name aibeginner.cn www.aibeginner.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 3) 443 正式站点
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name aibeginner.cn www.aibeginner.cn;

    client_max_body_size 1m;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 备案通过后才会启用 HSTS；先用较短 max-age，确认无 HTTP 依赖后再调大
    add_header Strict-Transport-Security "max-age=86400" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    location = /api/healthz {
        proxy_pass http://app:8000;
        access_log off;
    }

    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
