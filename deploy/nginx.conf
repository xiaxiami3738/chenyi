# chenyi 反向代理配置
# 目的：把 80 端口的请求转给容器内的 FastAPI，并保证 SSE 流式输出不被缓冲。

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80 default_server;
    # 域名（aibeginner.cn 已注册，待 ICP 备案通过后解析）；末尾的 _ 保留为兜底，
    # 使 http://118.178.182.215 直连仍然可用。
    server_name aibeginner.cn www.aibeginner.cn _;

    client_max_body_size 1m;
    server_tokens off;

    # certbot HTTP-01 校验目录（首次签发与后续续期都走这里）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    location = /api/healthz {
        proxy_pass http://app:8000;
        access_log off;
    }

    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        # 不长期缓存：每次重新校验 etag，部署更新后浏览器能立刻拿到新前端
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 生成接口走限流；SSE 必须关闭缓冲，否则前端看不到逐字输出
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

