name: chenyi

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DB_PATH: /app/data/app.db
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-8000}
      TRUST_PROXY_HEADERS: "true"
      # M7.3 服务端加密代存主密钥：留空则代存功能关闭（纯浏览器 BYOK 不受影响）
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 由 deploy.sh 按 certs 是否存在选择 HTTP / HTTPS 配置后复制到 runtime/
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Let's Encrypt 证书续期：每 12 小时检查一次，续期成功后容器内不重启 nginx，
  # 由 deploy.sh / 手动 `docker compose exec nginx nginx -s reload` 生效。
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"