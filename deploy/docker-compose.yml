name: chenyi

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DB_PATH: /app/data/app.db
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-8000}
      TRUST_PROXY_HEADERS: "true"
      # M7.3 服务端加密代存主密钥：留空则代存功能关闭（纯浏览器 BYOK 不受影响）
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"