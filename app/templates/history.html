{% extends "base.html" %}
{% block title %}我的学习历史 · AI 开发入门向导{% endblock %}
{% block content %}
<section class="hero">
  <h1>我的学习历史</h1>
  <p class="lead">
    这里记录的是<strong>当前浏览器</strong>（匿名 client_id）生成过的学习路径。
    点击任意卡片可查看该会话的摘要，也可以随时把完整计划下载为 Markdown。
  </p>
</section>

<section class="card">
  <div class="actions history-head">
    <h2>
      <span class="heading-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </span>
      历史会话
    </h2>
    <button type="button" class="btn" id="history-refresh">刷新</button>
  </div>
  <p id="history-empty" class="muted" hidden>
    还没有生成过学习路径，去<a href="/">首页</a>生成一个吧。
  </p>
  <div id="history-list" class="history-list"></div>
</section>

<section class="card" id="history-detail" hidden>
  <h2>
    <span class="heading-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M9 13h6M9 17h6"/>
      </svg>
    </span>
    会话详情
  </h2>
  <div id="detail-root"></div>
</section>
{% endblock %}
